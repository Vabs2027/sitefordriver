{% extends 'base.html' %}
{% block content %}

<h1>Категории дорожных знаков</h1>
<ol>
    {% for category in categories %}
        <li><a href="{% url 'category_detail' topic_id=topic_id category_id=category.id  %}">{{ category.name }}</a></li>
    {% empty %}
        <li>Категорий нет</li>
    {% endfor %}
</ol>

{% endblock %}
